services:
  falkordb:
    image: falkordb/falkordb:6.0.2
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - falkordb-data:/data
    command: ["--appendonly", "yes", "--dir", "/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  falkordb-data: